<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live QR — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v3-dark.css">
<style>
.steps { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 14px; font-weight: 600; }
.steps span { display: flex; align-items: center; gap: 8px; }
.steps img { width: 30px; height: 30px; border-radius: 9px; background: rgba(255, 255, 255, .92); }
.steps i { width: 26px; height: 1px; background: linear-gradient(90deg, transparent, rgba(167, 139, 250, .8), transparent); }
.example { position: absolute; right: 30%; top: 150px; transform: translateZ(160px); padding: 7px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .12em;
  color: #E9D5FF; background: rgba(124, 58, 237, .35); border: 1px solid rgba(196, 181, 253, .4); backdrop-filter: blur(10px); }
</style>
</head>
<body>
<div class="sky" aria-hidden="true">
  <div class="aurora a1"></div><div class="aurora a2"></div><div class="aurora a3"></div>
  <div class="stars"></div><div class="grain"></div>
</div>

<div class="page">
  <header class="nav">
    <a class="brand" href="#"><img src="img/gradient-qr-app-icon.png" alt="">Live QR</a>
    <div class="spacer"></div>
    <button class="avatar" type="button" aria-label="Account menu">AR</button>
  </header>

  <section class="hero">
    <div class="copy">
      <span class="hello"><i aria-hidden="true"></i>Welcome, Asha</span>
      <h1>One sentence.<br><em>One live page.</em></h1>

      <form class="composer" onsubmit="return false">
        <div class="composer-in">
          <label for="describe" class="sr">Describe your business</label>
          <textarea id="describe" rows="2" placeholder="e.g. A bakery in Jodhpur with cakes, timings and a call button"></textarea>
          <div class="tools">
            <button class="tool" type="button" aria-label="Add photos">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 8"/></svg><span>Photos</span>
            </button>
            <button class="tool" type="button" aria-label="Paste a link">
              <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg><span>Link</span>
            </button>
            <div class="spacer"></div>
            <button class="go" type="submit">Create<b aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></b></button>
          </div>
        </div>
      </form>

      <div class="steps" aria-label="How it works">
        <span><img src="img/glossy-pastel-magic-sparkles-icon.png" alt="">Describe</span><i aria-hidden="true"></i>
        <span><img src="img/glossy-blue-qr-code-app-icon.png" alt="">Get your QR</span><i aria-hidden="true"></i>
        <span><img src="img/glossy-orange-analytics-app-icon.png" alt="">Watch the scans</span>
      </div>
    </div>

    <div class="scene-wrap" aria-label="Example: a café's QR code opens its live menu page">
      <div class="scene" id="scene">
        <div class="halo"></div>
        <div class="device">
          <div class="screen"><img src="img/daily-brew-page.webp" alt="An example café page"></div>
          <div class="notch"></div><div class="shine"></div>
        </div>
        <svg class="beam" viewBox="0 0 100 90" fill="none" aria-hidden="true">
          <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#60A5FA"/><stop offset="1" stop-color="#E879F9"/></linearGradient></defs>
          <path d="M2 60 C 30 10, 70 80, 98 30" stroke="url(#bg)" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <div class="qr-card">
          <img src="img/living-qr.svg" alt="Example QR code">
          <span><i aria-hidden="true"></i>Scan to open</span>
        </div>
        <div class="example">EXAMPLE</div>
      </div>
    </div>
  </section>
</div>

<section class="stage" aria-labelledby="start">
  <div class="floor" aria-hidden="true"></div>
  <div class="floor-glow" aria-hidden="true"></div>
  <div class="stage-head">
    <div>
      <h2 id="start">Or pick a starting point</h2>
    </div>
  </div>
  <nav class="types" aria-label="Page types">
    <a class="type" href="#" style="--tint: #3B82F6"><img src="img/Blue-Storefront-App-Icon.png" alt=""><strong>Business page<small>Shop, salon, studio</small></strong>
      <span class="arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <a class="type" href="#" style="--tint: #F43F5E"><img src="img/Minimal-Coral-Cutlery-Icon.png" alt=""><strong>Restaurant menu<small>Café, kitchen, bakery</small></strong>
      <span class="arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <a class="type" href="#" style="--tint: #A855F7"><img src="img/Pastel-Purple-Profile-Card-Icon.png" alt=""><strong>Business card<small>You, in one scan</small></strong>
      <span class="arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <a class="type" href="#" style="--tint: #EC4899"><img src="img/Minimalist-Pink-Calendar-App-Icon.png" alt=""><strong>Event<small>Invites and RSVPs</small></strong>
      <span class="arrow" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </nav>
</section>

<script>
// Gentle parallax: the hero scene follows the pointer. Skipped when the user prefers reduced motion.
const scene = document.getElementById('scene');
if (!matchMedia('(prefers-reduced-motion: reduce)').matches && matchMedia('(min-width: 721px)').matches) {
  addEventListener('pointermove', (e) => {
    const x = e.clientX / innerWidth - 0.5, y = e.clientY / innerHeight - 0.5;
    scene.style.transform = `rotateY(${-16 + x * 14}deg) rotateX(${6 - y * 10}deg)`;
  });
}
</script>
</body>
</html>
